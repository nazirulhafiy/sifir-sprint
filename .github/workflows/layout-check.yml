# Layout check for pull requests. Does not deploy Pages.
name: Layout check

on:
  pull_request:

permissions:
  contents: read

jobs:
  layout-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Layout check
        run: npm run layout-check
